name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Restore
        run: dotnet restore MirrorPulse.sln

      - name: Build
        run: dotnet build MirrorPulse.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MirrorPulse.sln --configuration Release --no-build
