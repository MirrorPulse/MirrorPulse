name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_shell:
        description: Run the Shell registration probe from the installed App process
        type: boolean
        default: false
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MirrorPulse.sln --locked-mode

      - name: Verify formatting
        run: pwsh ./eng/verify-format.ps1

      - name: Verify Windows targets
        run: pwsh ./eng/verify-platform.ps1

      - name: Build
        run: dotnet build MirrorPulse.sln --configuration Release --no-restore

      - name: Install SFTP fixture dependencies
        run: "python -m pip install --only-binary=:all: -r eng/sftp-fixture/requirements.txt"

      - name: Test
        run: dotnet test MirrorPulse.sln --configuration Release --no-build

      - name: Verify Host publishes
        run: pwsh ./eng/verify-publish.ps1

      - name: Verify native Cloud Files integration
        if: github.event_name == 'workflow_dispatch'
        run: pwsh ./eng/verify-native.ps1

      - name: Verify installed MSIX Cloud Files identity
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          MIRRORPULSE_VERIFY_SHELL: ${{ inputs.verify_shell }}
        run: |
          if ($env:MIRRORPULSE_VERIFY_SHELL -eq 'true') {
            pwsh ./eng/verify-msix-cloudfiles.ps1 -VerifyShell
          } else {
            pwsh ./eng/verify-msix-cloudfiles.ps1
          }

  official-package-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MirrorPulse.sln --locked-mode

      - name: Install SFTP fixture dependencies
        run: "python -m pip install --only-binary=:all: -r eng/sftp-fixture/requirements.txt"

      - name: Verify signed official packages and native ARM64 Workers
        run: dotnet test tests/MirrorPulse.Core.Tests/MirrorPulse.Core.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~SignedPackageProcessTests

  official-adapters:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore package verifier
        run: dotnet restore tests/MirrorPulse.Core.Tests/MirrorPulse.Core.Tests.csproj --locked-mode

      - name: Aggregate latest official Adapter releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pwsh ./eng/aggregate-official-adapters.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/artifacts/official-adapters"

      - name: Download previous signed Local Adapter release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $directory = "$env:GITHUB_WORKSPACE/artifacts/local-previous"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          gh release download v0.1.3 --repo MirrorPulse/adapter-local --dir $directory --pattern 'com.mirrorpulse.adapter.local-0.1.3.mpadapter*'
          if ($LASTEXITCODE -ne 0) { throw 'The previous signed Local Adapter release could not be downloaded.' }

      - name: Install every signed official Adapter with the production verifier
        env:
          MIRRORPULSE_OFFICIAL_AGGREGATE: ${{ github.workspace }}/artifacts/official-adapters
          MIRRORPULSE_LOCAL_PREVIOUS_RELEASE: ${{ github.workspace }}/artifacts/local-previous
        run: dotnet test tests/MirrorPulse.Core.Tests/MirrorPulse.Core.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~OfficialAdapterAggregateProcessTests|FullyQualifiedName~SignedWebDavWorkerProcessTests|FullyQualifiedName~SignedLocalVersionSwitchProcessTests"

      - name: Upload official Adapter aggregate
        uses: actions/upload-artifact@v4
        with:
          name: official-adapters
          path: artifacts/official-adapters
          if-no-files-found: error
