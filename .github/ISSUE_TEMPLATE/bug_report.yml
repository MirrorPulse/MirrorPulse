name: Bug report
description: Report a reproducible problem in MirrorPulse.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets, tokens, private paths, and personal data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest steps that reproduce the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Windows version, architecture, MP version, and Adapter version.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Local diagnostics
      description: Paste sanitized local logs or diagnostic IDs.
    validations:
      required: false
